<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldFlow v3 — BLA Studios</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --border:#2c313c;
    --text:#e8eaf0; --muted:#8b91a0; --accent:#f5a623; --accent-dim:#7a5310;
    --red:#ef4444; --amber:#f59e0b; --green:#22c55e; --blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:15px;width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}

  /* ---- Login ---- */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
  .login-box .bolt{font-size:40px}
  .login-box h1{font-size:26px;margin:8px 0 2px;letter-spacing:.02em}
  .login-box .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .login-box input{margin-bottom:12px;text-align:left}
  .btn{background:var(--accent);color:#181000;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;width:100%;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);font-weight:500}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  .login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}

  /* ---- Header ---- */
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}
  .header-bolt{font-size:20px;color:var(--accent)}
  .header-brand h1{font-size:18px;font-weight:700}
  .header-brand .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .header-spacer{flex:1}
  #clock{text-align:right;line-height:1.4}
  #clock .time{color:var(--text);font-size:16px;font-weight:600}
  #clock .date{color:var(--muted);font-size:12px}
  .btn-signout{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;margin-left:6px}
  .btn-archive{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;margin-left:6px}
  .crew-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-left:14px;letter-spacing:.03em}
  .crew-name{font-size:13px;color:var(--muted);margin-left:6px;white-space:nowrap}

  main{padding:18px 18px 110px}

  /* ---- Command center stats ---- */
  .cmd-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
  .cmd-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
  .cmd-stat .num{font-size:22px;font-weight:800;line-height:1}
  .cmd-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .cmd-stat.alert-red .num{color:var(--red)}
  .cmd-stat.alert-amber .num{color:var(--amber)}
  .cmd-stat.money .num{color:var(--accent);font-size:17px}

  /* ---- Three columns ---- */
  .cmd-columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .cmd-col-head{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:2px solid;margin-bottom:12px}
  .col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .col-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .col-count{margin-left:auto;font-size:12px;color:var(--muted)}

  .col-fire .cmd-col-head{border-color:var(--red)}
  .col-fire .col-dot{background:var(--red)}
  .col-fire .col-title{color:var(--red)}
  .col-week .cmd-col-head{border-color:var(--amber)}
  .col-week .col-dot{background:var(--amber)}
  .col-week .col-title{color:var(--amber)}
  .col-later .cmd-col-head{border-color:var(--green)}
  .col-later .col-dot{background:var(--green)}
  .col-later .col-title{color:var(--green)}

  /* ---- TV job cards ---- */
  .tv-card{background:var(--card);border-radius:10px;padding:13px 15px;margin-bottom:9px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
  .tv-card:hover{background:var(--card2)}
  .col-fire .tv-card{border-left-color:var(--red)}
  .col-week .tv-card{border-left-color:var(--amber)}
  .col-later .tv-card{border-left-color:var(--green)}
  .tv-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
  .tv-card .card-name{font-size:14px;font-weight:700;line-height:1.3;flex:1;min-width:0}
  .tv-card .card-client{font-size:12px;color:var(--muted);margin-bottom:9px}
  .tv-card .card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .card-value{font-size:13px;color:var(--accent);font-weight:700;margin-left:auto;white-space:nowrap;padding-left:8px}
  .tv-card .card-need{font-size:12px;color:var(--text);margin-top:8px;line-height:1.35;background:var(--card2);border-radius:6px;padding:6px 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tv-card .card-need b{color:var(--accent);font-weight:700;margin-right:5px;text-transform:uppercase;font-size:10px;letter-spacing:.04em}
  .tv-card .notes-toggle{cursor:pointer;font-size:11px;color:var(--muted);user-select:none;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
  .tv-card .notes-toggle:hover{color:var(--text)}
  .tv-card .notes-toggle .chev{transition:transform .15s}
  .tv-card.notes-open .notes-toggle .chev{transform:rotate(180deg)}
  .tv-card .notes-panel{display:none;margin-top:6px;padding:8px 10px;background:var(--card2);border-left:3px solid var(--accent);border-radius:4px;font-size:12px;white-space:pre-wrap;color:var(--text);line-height:1.4}
  .tv-card.notes-open .notes-panel{display:block}
  /* ---- Job milestones ---- */
  .tv-card .ms-row{display:flex;align-items:center;gap:7px;margin-top:8px;padding:6px 8px;background:var(--card2);border-radius:6px;font-size:12px}
  .tv-card .ms-check{width:16px;height:16px;flex-shrink:0;cursor:pointer;accent-color:var(--green)}
  .tv-card .ms-label{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .tv-card .ms-label .ms-kicker{color:var(--accent);font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.04em;margin-right:5px}
  .tv-card .ms-date{color:var(--muted);white-space:nowrap;font-size:11px}
  .tv-card .ms-prog{color:var(--muted);font-size:10px;background:var(--bg);border-radius:4px;padding:1px 5px;white-space:nowrap}
  .tv-card .ms-allclear{color:var(--green);font-size:11px;font-weight:600;margin-left:2px}
  /* milestone management (job screen) */
  .ms-list{margin:6px 0 10px}
  .ms-edit-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .ms-edit-row input[type=checkbox]{width:auto;flex-shrink:0;accent-color:var(--green);transform:scale(1.15)}
  .ms-edit-row .ms-edit-label{flex:1;min-width:120px}
  .ms-edit-row .ms-edit-date{width:150px;flex-shrink:0}
  .ms-edit-row button{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:6px;width:32px;height:38px;flex-shrink:0;cursor:pointer;font-size:14px;padding:0}
  .ms-edit-row button:disabled{opacity:.3;cursor:default}
  .ms-edit-row .ms-del{color:var(--red);border-color:transparent}
  .ms-add{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .ms-add input[type=text]{flex:1;min-width:120px}
  .ms-add input[type=date]{width:150px;flex-shrink:0}
  /* milestone crunch view (dashboard) */
  .ms-crunch{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .ms-crunch-head{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;user-select:none;font-size:13px}
  .ms-crunch-head .ct{font-weight:700}
  .ms-crunch-head .csum{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
  .ms-crunch-head .cchev{margin-left:auto;transition:transform .15s;color:var(--muted)}
  .ms-crunch.open .cchev{transform:rotate(180deg)}
  .ms-crunch-body{display:none;border-top:1px solid var(--border);padding:4px 12px 8px}
  .ms-crunch.open .ms-crunch-body{display:block}
  .ms-crunch-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
  .ms-crunch-row:last-child{border-bottom:none}
  .ms-crunch-row input[type=checkbox]{width:auto;flex-shrink:0;accent-color:var(--green);transform:scale(1.1)}
  .ms-crunch-row .cr-label{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-crunch-row .cr-job{color:var(--muted);font-weight:400;font-size:11px}
  .ms-crunch-row .cr-date{white-space:nowrap;font-size:12px}
  .ms-crunch-row .cr-date.od{color:var(--red);font-weight:700}
  .ms-crunch-row .cr-date.soon{color:var(--amber)}
  .ms-crunch-row .cr-date.later{color:var(--muted)}
  .ms-crunch-row .cr-who{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#111;flex-shrink:0;letter-spacing:.02em}
  /* AI coordination lane (visible to humans by design) */
  .ai-lane{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-top:18px;overflow:hidden}
  .ai-lane-head{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;user-select:none;font-size:13px}
  .ai-lane-head .alt{font-weight:700}
  .ai-lane-head .als{color:var(--muted);font-size:12px}
  .ai-lane-head .alchev{margin-left:auto;transition:transform .15s;color:var(--muted)}
  .ai-lane.open .alchev{transform:rotate(180deg)}
  .ai-lane-body{display:none;border-top:1px solid var(--border);padding:4px 14px 10px}
  .ai-lane.open .ai-lane-body{display:block}
  .ai-msg{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .ai-msg:last-child{border-bottom:none}
  .ai-msg .am-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:3px}
  .ai-msg .am-agents{font-weight:700;color:var(--text)}
  .ai-msg .am-kind{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  .ai-msg .am-subject{font-weight:600;margin-bottom:2px}
  .ai-msg .am-body{white-space:pre-wrap;color:var(--text);line-height:1.45;font-size:12.5px}
  /* ---- Weather ticker (compact one-line) ---- */
  .wx-bar{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:14px;overflow:hidden}
  .wx-now{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
  .wx-track{display:flex;gap:14px;overflow-x:auto;font-size:12px}
  .wx-item{white-space:nowrap;color:var(--muted)}
  .wx-item b{color:var(--text);font-weight:600;margin-right:2px}
  .wx-item.wx-today b{color:var(--accent)}
  .wx-item .wx-pp{color:#5aa9e6}
  .wx-msg{font-size:12px;color:var(--muted)}
  /* ---- Rainy-deadline alert ---- */
  .wx-alert{background:rgba(90,169,230,.10);border:1px solid #2f4a63;border-radius:12px;padding:11px 14px;margin-bottom:14px}
  .wx-alert-head{font-size:11px;color:#7fb6e6;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px}
  .wx-alert-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:13px;color:var(--text)}
  .wx-alert-row:not(:last-child){border-bottom:1px solid var(--border)}
  .wx-alert-pp{color:#5aa9e6;font-weight:700;white-space:nowrap}
  .tv-card .wx-chip{font-size:10px;font-weight:700;color:#5aa9e6;background:rgba(90,169,230,.12);border-radius:5px;padding:2px 6px;white-space:nowrap}

  /* ---- Issue cards ---- */
  .tv-issue{background:#1f1212;border:1px solid #3b1515;border-radius:10px;padding:11px 14px;margin-bottom:9px;border-left:3px solid var(--red);cursor:pointer}
  .tv-issue:hover{background:#261515}
  .iss-label{font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px}
  .iss-text{font-size:13px;line-height:1.4}
  .iss-job{font-size:11px;color:var(--muted);margin-top:3px}

  .col-empty{text-align:center;padding:30px 16px;color:#2a2f3a;font-size:13px}

  /* ---- Done section ---- */
  .done-toggle{background:none;border:none;color:var(--muted);font-size:13px;padding:0;margin-top:22px;text-decoration:underline}
  .done-toggle:hover{color:var(--text)}

  /* ---- Flags ticker ---- */
  .ticker-bar{background:#1f1212;border-top:1px solid #3b1515;padding:9px 18px;display:flex;align-items:center;gap:12px;overflow:hidden;margin-top:20px;border-radius:10px}
  .ticker-label{font-size:11px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;flex-shrink:0}
  .ticker-scroll{overflow:hidden;flex:1}
  .ticker-inner{display:flex;gap:32px;animation:ticker 20s linear infinite}
  .ticker-inner:hover{animation-play-state:paused}
  @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
  .ticker-item{white-space:nowrap;font-size:13px;color:#ffb3b3;cursor:pointer;flex-shrink:0}
  .ticker-item .ti-job{color:var(--muted);font-size:11px;margin-left:6px}

  /* ---- Tab nav ---- */
  .tab-nav{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;padding:8px 16px;margin-bottom:-1px;transition:color .15s,border-color .15s;font-weight:500}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-pane{display:none}
  .tab-pane.active{display:block}

  /* ---- Flag button ---- */
  .flag-btn{background:#2a1414;border:1px solid #5a2020;color:#ff9d9d;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .flag-btn:hover{background:#3a1a1a}

  /* ---- Documents ---- */
  .doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
  .doc-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;position:relative}
  .doc-card:hover{border-color:var(--accent)}
  .doc-card .doc-icon{font-size:32px;margin-bottom:6px}
  .doc-card .doc-name{font-size:11px;color:var(--muted);word-break:break-word;line-height:1.3}
  .doc-card .doc-label{font-size:10px;color:var(--accent);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .doc-card .doc-del{position:absolute;top:5px;right:7px;background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:2px}
  .doc-card .doc-del:hover{color:var(--red)}
  .upload-area{border:1px dashed var(--border);border-radius:10px;padding:24px;text-align:center;margin-top:12px;cursor:pointer}
  .upload-area:hover{border-color:var(--accent);background:rgba(245,166,35,.04)}
  .upload-area p{color:var(--muted);font-size:13px;margin-top:6px}

  /* ---- Costs ---- */
  .cost-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .cost-stat{background:var(--card2);border-radius:8px;padding:10px 12px;text-align:center}
  .cost-stat .num{font-size:18px;font-weight:700}
  .cost-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
  .cost-stat.profit .num{color:var(--green)}
  .cost-stat.loss .num{color:var(--red)}
  .cost-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .cost-row:last-child{border-bottom:none}
  .cost-row .cost-desc{flex:1;min-width:0}
  .cost-row .cost-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cost-row .cost-meta{font-size:11px;color:var(--muted);margin-top:1px}
  .cost-row .cost-amt{font-weight:700;color:var(--text);white-space:nowrap;margin-left:8px}
  .cost-row .cost-receipt{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;flex-shrink:0}
  .cost-section-head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px;font-weight:600}
  .add-cost-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;margin-top:10px}
  .add-cost-btn:hover{border-color:var(--accent);color:var(--text)}

  /* ---- End-of-day check-in ---- */
  .btn-checkin{background:var(--green);color:#0a1f0f;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;margin-left:10px;white-space:nowrap}
  .btn-checkin:hover{filter:brightness(1.1)}
  .ci-step{display:none}.ci-step.active{display:block}
  .ci-progress{display:flex;gap:6px;margin-bottom:20px}
  .ci-pip{flex:1;height:3px;border-radius:99px;background:var(--border)}
  .ci-pip.done{background:var(--green)}
  .ci-pip.active{background:var(--accent)}
  .job-check{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:border-color .12s}
  .job-check.selected{border-color:var(--accent);background:#1e1a0f}
  .job-check input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
  .job-check .jc-info{flex:1;min-width:0}
  .job-check .jc-name{font-size:14px;font-weight:600}
  .job-check .jc-client{font-size:12px;color:var(--muted)}
  .hours-entry{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
  .hours-entry .he-name{font-size:14px;font-weight:700;margin-bottom:10px}
  .hours-row{display:flex;gap:10px;align-items:center}
  .hours-row input[type=number]{width:90px;flex-shrink:0}
  .hours-row input[type=text]{flex:1}

  /* ---- Crew view ---- */
  .crew-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
  .crew-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .crew-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .crew-card-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
  .crew-card-name{font-size:15px;font-weight:700}
  .crew-card-role{font-size:12px;color:var(--muted)}
  .crew-plan{font-size:13px;color:var(--muted);font-style:italic;padding:8px 0;border-top:1px solid var(--border)}
  .crew-plan strong{color:var(--text);font-style:normal}
  .crew-checkin-time{font-size:11px;color:var(--muted);margin-top:6px}

  /* ---- Today's plan bar ---- */
  .plan-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px}
  .plan-bar-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;font-weight:600}
  .plan-bar-crew{display:flex;gap:16px;flex-wrap:wrap}
  .plan-person{display:flex;align-items:flex-start;gap:8px}
  .plan-person .plan-text{font-size:13px;color:var(--text);flex:1}

  /* ---- Chips & tags ---- */

  .chip.prio-Medium{background:#16202d;color:#9ec5ff}
  .chip.prio-Low{background:#1c1f26;color:#9aa3b5}
  .chip.phase{background:var(--accent-dim);color:#ffd98a}
  .chip.hold{background:#26222e;color:#c4b5fd}
  .tag{font-size:11px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--muted)}
  .tag.issue{border-color:var(--red);color:#ff9d9d}
  .tag.issue button{background:none;border:none;color:var(--green);font-size:11px;margin-left:4px;padding:0;cursor:pointer}

  /* ---- Detail view ---- */
  .back{background:none;border:none;color:var(--accent);font-size:14px;padding:0;margin-bottom:14px;font-weight:600;cursor:pointer}
  .detail-head h2{font-size:22px}
  .detail-head .client{color:var(--muted);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px}
  .detail-wrap{max-width:860px}
  .panel h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
  .money-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .money-row:last-child{border-bottom:none}
  .money-row .val{font-weight:700}
  .owed{color:var(--amber)}

  /* ---- Logs ---- */
  .log{border-left:3px solid var(--accent);padding:10px 12px;background:var(--card2);border-radius:0 10px 10px 0;margin-top:10px}
  .log .date{font-size:12px;color:var(--muted);font-weight:700}
  .log .work{font-size:14px;margin-top:4px;white-space:pre-wrap}
  .log .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .log .photos{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .log .photos img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}

  /* ---- FAB & modals ---- */
  #fab{position:fixed;right:18px;bottom:18px;background:var(--accent);color:#181000;border:none;border-radius:99px;padding:16px 22px;font-size:16px;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:30}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
  .modal h3{margin-bottom:4px}
  .modal .row{display:flex;gap:10px}
  .modal .row>*{flex:1}
  .modal .actions{display:flex;gap:10px;margin-top:18px}
  .photo-previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photo-previews img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #lightbox img{max-width:94vw;max-height:92vh;border-radius:8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:10px;font-size:14px;z-index:60}
  .hidden{display:none!important}

  /* ---- Responsive ---- */
  @media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:16px}}
  @media(max-width:1000px){.cmd-columns{grid-template-columns:1fr}.cmd-stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.cmd-stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIG ============ */
const SB_URL = 'https://ejjxcumzfejvgfsuuyly.supabase.co';
const SB_KEY = 'sb_publishable_vqMMs5fsx6qDe1IliBqLXw_PyQlwBgP';
const PHASES = ['Quote','Design','Fabrication','Finishing','Install','Waiting on Client','Done'];
const STATUSES = ['Active','On Hold','Done'];
const PRIORITIES = ['High','Medium','Low'];
const BUCKET = 'job-photos';
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ============ STATE ============ */
let jobs = [], logs = [], resolved = new Set(), crew = [];
let milestones = [];
let crunchOpen = false;
let jobDocs = [], jobCosts = [], jobFlags = [], checkins = [], checkinJobs = [];
let teamMsgs = [];
let aiLane = [], aiLaneOpen = false;
let currentUser = null;
let view = {name:'dashboard', jobId:null};
let activeTab = 'overview';
let photoUrlCache = {}, docUrlCache = {};
let showDone = false;
// Check-in wizard state
let ci = { step:0, selectedJobs:[], entries:{}, plan:'' };

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => '$' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); };
function daysUntil(d){ if(!d) return null; return Math.round((new Date(d+'T12:00') - new Date(new Date().toDateString()))/86400000); }
function deadlineChip(d){
  const n = daysUntil(d);
  if(n===null) return '<span class="chip none">no deadline</span>';
  if(n<0) return `<span class="chip overdue">⚠ ${-n}d overdue</span>`;
  if(n===0) return '<span class="chip overdue">due today</span>';
  if(n<=7) return `<span class="chip soon">due in ${n}d</span>`;
  return `<span class="chip ok">${fmtDate(d)}</span>`;
}
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T12:00'); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const parseList = s => s.split(',').map(x=>x.trim()).filter(Boolean);
function crewName(id){ const m=crew.find(c=>c.id===id); return m?m.name:''; }
function relTime(ts){
  if(!ts) return '';
  const d=new Date(ts), diff=Math.floor((Date.now()-d.getTime())/1000);
  if(diff<45) return 'just now';
  const m=Math.floor(diff/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  const days=Math.floor(h/24); if(days<7) return days+'d ago';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function gifEmbed(body){
  // Pull the first URL out of a message and figure out if it's an embeddable image/GIF.
  const m=(body||'').match(/https?:\/\/[^\s]+/);
  if(!m) return {text:body, img:null, url:null};
  let url=m[0].replace(/[.,)\]]+$/,''); // trim trailing punctuation
  const text=body.replace(url,'').trim();
  let img=null, low=url.toLowerCase();
  if(/\.(gif|png|jpe?g|webp)(\?|$)/.test(low)){
    img=url;                                   // direct image/GIF
  } else if(/(^https?:\/\/)(media\d*\.giphy\.com|[^/]*\.?media\.tenor\.com|media\d*\.tenor\.com)/.test(low)){
    img=url;                                   // giphy/tenor direct media host
  } else {
    let g=url.match(/giphy\.com\/gifs\/(?:.*-)?([A-Za-z0-9]+)(?:\/|$|\?)/);
    if(g){ img=`https://media.giphy.com/media/${g[1]}/giphy.gif`; }
    else { let d=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if(d){ img=`https://drive.google.com/thumbnail?id=${d[1]}&sz=w480`; } }
  }
  return {text, img, url};
}
function needNote(j){
  // The "what needs doing now" line for a card: the most recent dated [m/d] note in scope.
  const s=(j.scope||'').trim();
  if(!s) return '';
  const re=/\[(\d{1,2}\/\d{1,2})\]\s*([^\n]*)/g;
  let m, last=null;
  while((m=re.exec(s))!==null){ last=m; }
  if(last && last[2].trim()) return last[2].trim();
  return s.split('\n')[0].trim(); // fallback: first line of scope
}
function updatedLine(j){
  if(!j.updated_at) return '';
  const who=crewName(j.updated_by);
  return `updated ${relTime(j.updated_at)}${who?' by '+esc(who):''}`;
}
async function postTeamMsg(){
  const inp=document.getElementById('tmInput'); if(!inp) return;
  const body=inp.value.trim(); if(!body) return;
  const btn=document.getElementById('tmSend'); if(btn) btn.disabled=true;
  const {error}=await sb.from('team_messages').insert({author: currentUser?.id||null, body});
  if(error){ toast('Failed: '+error.message); if(btn) btn.disabled=false; return; }
  inp.value=''; await loadData(); render();
}

function startClock(){
  function tick(){
    const now = new Date();
    const time = now.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const date = now.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    const el = document.getElementById('clock');
    if(el) el.innerHTML = `<div class="time">${time}</div><div class="date">${date}</div>`;
  }
  tick();
  setInterval(tick, 30000);
}

/* ============ AUTH ============ */
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ showApp(); } else { $('#login').classList.remove('hidden'); }
}
$('#loginBtn').onclick = doLogin;
$('#password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
async function doLogin(){
  $('#loginErr').textContent = '';
  const {error} = await sb.auth.signInWithPassword({email:$('#email').value.trim(), password:$('#password').value});
  if(error){ $('#loginErr').textContent = error.message; return; }
  showApp();
}
$('#signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function showApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  startClock();
  await loadData();
  render();
  subscribeRealtime();
}

/* ============ DATA ============ */
async function loadData(){
  const [j, l, r, c, d, co, f, ci_r, cij_r, tm, ms, al] = await Promise.all([
    sb.from('jobs').select('*'),
    sb.from('logs').select('*').order('date',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('resolved_issues').select('key'),
    sb.from('crew_members').select('*'),
    sb.from('job_documents').select('*').order('created_at',{ascending:false}),
    sb.from('job_costs').select('*').order('date',{ascending:false}),
    sb.from('job_flags').select('*').order('created_at',{ascending:false}),
    sb.from('daily_checkins').select('*').order('date',{ascending:false}),
    sb.from('checkin_jobs').select('*'),
    sb.from('team_messages').select('*').order('created_at',{ascending:false}),
    sb.from('job_milestones').select('*').order('sequence',{ascending:true}),
    sb.from('agent_coordination').select('*').order('created_at',{ascending:false})
  ]);
  if(j.error||l.error){ toast('Load error: '+(j.error||l.error).message); return; }
  jobs = j.data||[]; logs = l.data||[]; resolved = new Set((r.data||[]).map(x=>x.key));
  crew = c.data||[]; jobDocs = d.data||[]; jobCosts = co.data||[]; jobFlags = f.data||[];
  checkins = ci_r.data||[]; checkinJobs = cij_r.data||[]; teamMsgs = tm.data||[];
  milestones = ms.data||[];
  aiLane = al.data||[];
  const {data:{user}} = await sb.auth.getUser();
  if(user) currentUser = crew.find(m=>m.id===user.id) || null;
  renderHeaderCrew();
}

function renderHeaderCrew(){
  const el = document.getElementById('headerCrew');
  if(!el) return;
  if(!currentUser){ el.innerHTML=''; return; }
  const bg = currentUser.color || '#f5a623';
  // Darken the bg color for text contrast — just use dark text
  el.innerHTML = `
    <div class="crew-avatar" style="background:${bg};color:#111">${esc(currentUser.initials||'?')}</div>
    <span class="crew-name">${esc(currentUser.name)}</span>`;
}
let rtChannel;
function subscribeRealtime(){
  if(rtChannel) return;
  rtChannel = sb.channel('fieldflow')
    .on('postgres_changes',{event:'*',schema:'public'}, async () => { await loadData(); render(); })
    .subscribe();
}

/* ============ RENDER ============ */
function render(){
  if(view.name==='dashboard') renderDashboard();
  else if(view.name==='archive') renderArchive();
  else renderJob(view.jobId);
}

function jobSort(a,b){
  const order = s => s==='Active'?0 : s==='On Hold'?1 : 2;
  if(order(a.status)!==order(b.status)) return order(a.status)-order(b.status);
  if(!a.deadline && !b.deadline) return a.name.localeCompare(b.name);
  if(!a.deadline) return 1; if(!b.deadline) return -1;
  return a.deadline.localeCompare(b.deadline);
}

function renderDashboard(){
  const active = jobs.filter(j=>j.status!=='Done');
  const done   = jobs.filter(j=>j.status==='Done');

  // Urgency buckets
  const handleNow = active.filter(j=>{ const n=daysUntil(j.deadline); return n!==null && n<=0; }).sort(jobSort);
  const thisWeek  = active.filter(j=>{ const n=daysUntil(j.deadline); return n!==null && n>0 && n<=7; }).sort(jobSort);

  // Priority buckets for the three columns (driven by each job's Priority field)
  const prioOf   = j => { const p=j.priority||'Medium'; return (p==='High'||p==='Low')?p:'Medium'; };
  const highJobs = active.filter(j=>prioOf(j)==='High').sort(jobSort);
  const medJobs  = active.filter(j=>prioOf(j)==='Medium').sort(jobSort);
  const lowJobs  = active.filter(j=>prioOf(j)==='Low').sort(jobSort);

  // Open issues (unresolved)
  const openIssues = logs.flatMap(l=>(l.issues||[]).map((iss,i)=>({
    key: l.id+'|'+i, iss, jobId: l.job_id
  }))).filter(x=>!resolved.has(x.key));

  const outstanding = active.reduce((s,j)=>s+Number(j.still_owed||0),0);

  /* --- Today's plan bar (from yesterday's check-ins) --- */
  const todayStr = today();
  const crewWithPlans = crew.map(m=>{
    // Get their most recent check-in that has a plan
    const lastCI = checkins.filter(c=>c.crew_member_id===m.id && c.plan_tomorrow).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // Only show if the check-in was yesterday or today
    const ciDate = lastCI?.date;
    const isRecent = ciDate && (ciDate===todayStr || ciDate===yesterday());
    return { m, plan: isRecent ? lastCI.plan_tomorrow : null, date: ciDate };
  }).filter(x=>x.plan);

  let html = '';

  /* --- Activity ticker (recent updates + board posts) --- */
  html += renderActivityTicker();

  /* --- Compact weather ticker --- */
  html += renderWeatherStrip();

  /* --- Rainy INSTALL-day alerts (weather-sensitive jobs with an install date) --- */
  const wxFlags = rainyFlags();
  if(wxFlags.length){
    html += `<div class="wx-alert">
      <div class="wx-alert-head">☔ Rain expected on an install day</div>
      ${wxFlags.map(f=>{
        const dt=new Date(f.job.install_date+'T12:00:00');
        const dow=dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
        return `<div class="wx-alert-row" onclick="goJob('${f.job.id}')">
          <span>${f.ic} <b>${esc(f.job.name)}</b> — install ${dow}</span>
          <span class="wx-alert-pp">${f.pp}% rain</span>
        </div>`;
      }).join('')}
    </div>`;
  }

  /* --- Milestone crunch view (collapsed one-liner unless expanded) --- */
  html += renderMilestoneCrunch();

  /* --- Priority board --- */
  html += `<div class="cmd-columns">`;

  /* Column 1 — High priority */
  const col1Count = `${highJobs.length} job${highJobs.length!==1?'s':''} · ${openIssues.length} issue${openIssues.length!==1?'s':''}`;
  html += `<div class="cmd-col col-fire">
    <div class="cmd-col-head">
      <div class="col-dot"></div>
      <div class="col-title">High priority</div>
      <div class="col-count">${col1Count}</div>
    </div>`;
  if(!highJobs.length && !openIssues.length){
    html += `<div class="col-empty">No high-priority jobs</div>`;
  } else {
    html += highJobs.map(j=>tvJobCard(j)).join('');
    html += openIssues.map(x=>{
      const j = jobs.find(jj=>jj.id===x.jobId);
      return `<div class="tv-issue" onclick="${j?`goJob('${j.id}')`:''}"}>
        <div class="iss-label">⚠ Open issue</div>
        <div class="iss-text">${esc(x.iss)}</div>
        ${j?`<div class="iss-job">${esc(j.name)}</div>`:''}
      </div>`;
    }).join('');
  }
  html += `</div>`;

  /* Column 2 — Due This Week */
  html += `<div class="cmd-col col-week">
    <div class="cmd-col-head">
      <div class="col-dot"></div>
      <div class="col-title">Medium priority</div>
      <div class="col-count">${medJobs.length} job${medJobs.length!==1?'s':''}</div>
    </div>`;
  if(!medJobs.length){
    html += `<div class="col-empty">No medium-priority jobs</div>`;
  } else {
    html += medJobs.map(j=>tvJobCard(j)).join('');
  }
  html += `</div>`;

  /* Column 3 — Coming Up */
  html += `<div class="cmd-col col-later">
    <div class="cmd-col-head">
      <div class="col-dot"></div>
      <div class="col-title">Low priority</div>
      <div class="col-count">${lowJobs.length} job${lowJobs.length!==1?'s':''}</div>
    </div>`;
  if(!lowJobs.length){
    html += `<div class="col-empty">No low-priority jobs</div>`;
  } else {
    html += lowJobs.map(j=>tvJobCard(j)).join('');
  }
  html += `</div>`;

  html += `</div>`; /* end cmd-columns */

  /* --- Today's plan bar --- */
  if(crewWithPlans.length){
    html += `<div class="plan-bar">
      <div class="plan-bar-head">Today's plan</div>
      <div class="plan-bar-crew">
        ${crewWithPlans.map(({m,plan})=>`
          <div class="plan-person">
            <div style="width:28px;height:28px;border-radius:50%;background:${m.color||'#f5a623'};color:#111;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${esc(m.initials||'?')}</div>
            <div class="plan-text"><span class="plan-name">${esc(m.name)}</span>${esc(plan)}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }


  /* --- Team Board --- */
  html += `<div class="panel" style="margin-top:18px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600">💬 Team Board</span>
      <span style="font-size:11px;color:var(--muted)">notes for the crew</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="tmInput" placeholder="Leave a note for the team…" onkeydown="if(event.key==='Enter')postTeamMsg()" style="flex:1">
      <button id="tmSend" class="btn" style="width:auto;padding:9px 16px" onclick="postTeamMsg()">Post</button>
    </div>
    ${teamMsgs.length ? teamMsgs.slice(0,12).map(mm=>{
      const who=crewName(mm.author);
      const med=gifEmbed(mm.body);
      let bodyHtml;
      if(med.img){
        bodyHtml=`${med.text?`<div style="font-size:14px;margin-top:1px;white-space:pre-wrap">${esc(med.text)}</div>`:''}
          <img src="${esc(med.img)}" alt="gif" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('a'),{href:'${esc(med.url)}',target:'_blank',textContent:'${esc(med.url)}',style:'font-size:13px;color:var(--accent);word-break:break-all'}))" style="max-width:240px;max-height:200px;border-radius:8px;margin-top:6px;display:block;border:1px solid var(--border)">`;
      } else {
        bodyHtml=`<div style="font-size:14px;margin-top:1px;white-space:pre-wrap">${esc(mm.body)}</div>`;
      }
      return `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        ${who?crewAvatar(mm.author,26):'<span style="width:26px;flex-shrink:0;display:inline-block"></span>'}
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;color:var(--muted)">${who?esc(who):'Someone'} · ${relTime(mm.created_at)}</div>
          ${bodyHtml}
        </div>

/* ---- Weather (Open-Meteo — free, no API key, browser-fetchable) ---- */
let wxData=null, wxAt=0, wxLoading=false;
const WX_TTL=30*60*1000; // refetch at most every 30 min
function wxIcon(c){
  if(c===0) return ['☀️','Clear'];
  if(c===1) return ['🌤️','Mainly clear'];
  if(c===2) return ['⛅','Partly cloudy'];
  if(c===3) return ['☁️','Overcast'];
  if(c>=45&&c<=48) return ['🌫️','Fog'];
  if(c>=51&&c<=57) return ['🌦️','Drizzle'];
  if(c>=61&&c<=67) return ['🌧️','Rain'];
  if(c>=71&&c<=77) return ['❄️','Snow'];
  if(c>=80&&c<=82) return ['🌧️','Showers'];
  if(c>=85&&c<=86) return ['🌨️','Snow showers'];
  if(c>=95) return ['⛈️','Thunderstorm'];
  return ['🌡️','—'];
}
async function ensureWeather(){
  if(wxLoading) return;
  if(wxData && wxData!=='error' && (Date.now()-wxAt)<WX_TTL) return;
  wxLoading=true;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=38.627&longitude=-90.199&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America/Chicago&forecast_days=7';
    const r=await fetch(u);
    if(!r.ok) throw new Error('wx '+r.status);
    wxData=await r.json(); wxAt=Date.now();
    if(view.name==='dashboard') render();
  }catch(e){ if(!wxData) wxData='error'; }
  finally{ wxLoading=false; }
}
function renderWeatherStrip(){
  if(wxData==='error') return `<div class="wx-bar"><span class="wx-msg">Weather unavailable</span></div>`;
  if(!wxData || !wxData.daily) return `<div class="wx-bar"><span class="wx-msg">Loading St. Louis forecast…</span></div>`;
  const d=wxData.daily, cur=wxData.current;
  const items=d.time.map((t,i)=>{
    const dt=new Date(t+'T12:00:00');
    const dow=i===0?'Today':dt.toLocaleDateString(undefined,{weekday:'short'});
    const [ic]=wxIcon(d.weather_code[i]);
    const hi=Math.round(d.temperature_2m_max[i]), lo=Math.round(d.temperature_2m_min[i]);
    const pp=d.precipitation_probability_max?d.precipitation_probability_max[i]:null;
    return `<span class="wx-item${i===0?' wx-today':''}"><b>${dow}</b> ${ic} ${hi}°/${lo}°${(pp!=null&&pp>=30)?` <span class="wx-pp">💧${pp}%</span>`:''}</span>`;
  }).join('');
  const curBit=cur?`<span class="wx-now">${wxIcon(cur.weather_code)[0]} ${Math.round(cur.temperature_2m)}° now · St. Louis</span>`:`<span class="wx-now">St. Louis</span>`;
  return `<div class="wx-bar">${curBit}<div class="wx-track">${items}</div></div>`;
}
function renderActivityTicker(){
  const items=[];
  jobs.filter(j=>j.updated_at).forEach(j=>items.push({ts:new Date(j.updated_at).getTime(), jobId:j.id, html:`↻ <strong>${esc(j.name)}</strong> updated${(j.updated_by&&crewName(j.updated_by))?' · '+esc(crewName(j.updated_by)):''}`}));
  (teamMsgs||[]).forEach(mm=>{ const who=crewName(mm.author); const txt=(gifEmbed(mm.body).text||mm.body||'').replace(/\s+/g,' ').trim(); items.push({ts:new Date(mm.created_at).getTime(), html:`💬 <strong>${who?esc(who):'Someone'}</strong>: ${esc(txt.slice(0,60))}${txt.length>60?'…':''}`}); });
  items.sort((a,b)=>b.ts-a.ts);
  const top=items.slice(0,12);
  if(!top.length) return '';
  const its=top.map(it=>`<span class="ticker-item"${it.jobId?` onclick="goJob('${it.jobId}')"`:''}>${it.html}</span>`).join('');
  return `<div class="ticker-bar">
    <span class="ticker-label">↻ Activity</span>
    <div class="ticker-scroll"><div class="ticker-inner">${its}${its}</div></div>
  </div>`;
}
const WX_RAIN_CODES=[61,63,65,66,67,80,81,82,95,96,99];
function jobRain(j){
  // Rain flag keys off the INSTALL DATE only (not the deadline) — a deadline is when
  // a job is due; install_date is when BLA is actually outside. No install date = no flag.
  if(!j.weather_sensitive || !j.install_date || j.status==='Done') return null;
  if(!wxData || wxData==='error' || !wxData.daily) return null;
  const d=wxData.daily, i=d.time.indexOf(j.install_date);
  if(i<0) return null;
  const pp=d.precipitation_probability_max?d.precipitation_probability_max[i]:0;
  const code=d.weather_code[i];
  if(pp>=55 || WX_RAIN_CODES.includes(code)) return {pp, ic:wxIcon(code)[0]};
  return null;
}
function rainyFlags(){
  return jobs.map(j=>{ const w=jobRain(j); return w?{job:j,...w}:null; }).filter(Boolean);
}

/* ---- Job milestones ---- */
function jobMilestones(id){ return milestones.filter(m=>m.job_id===id).slice().sort((a,b)=>(a.sequence-b.sequence)||(String(a.created_at)<String(b.created_at)?-1:1)); }
function nextMilestone(id){ return jobMilestones(id).find(m=>!m.done_at) || null; }
function msProgress(id){ const a=jobMilestones(id); return {done:a.filter(m=>m.done_at).length, total:a.length}; }
function fmtMsDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
async function toggleMilestone(id, makeDone){
  const {error} = await sb.from('job_milestones').update({done_at: makeDone ? new Date().toISOString() : null}).eq('id', id);
  if(error){ toast('Milestone: '+error.message); return; }
  await loadData(); render();
}
async function addMilestone(jobId){
  const lblEl=document.getElementById('msNewLabel_'+jobId), dtEl=document.getElementById('msNewDate_'+jobId);
  const label=(lblEl?.value||'').trim();
  if(!label){ toast('Enter a milestone name'); return; }
  const seq=jobMilestones(jobId).reduce((mx,x)=>Math.max(mx,x.sequence),-1)+1;
  const {error}=await sb.from('job_milestones').insert({job_id:jobId,label,due_date:(dtEl?.value||null)||null,sequence:seq,set_by:(currentUser&&currentUser.id)||null});
  if(error){ toast('Add milestone: '+error.message); return; }
  await loadData(); render();
}
async function updateMilestone(id,patch){
  const {error}=await sb.from('job_milestones').update(patch).eq('id',id);
  if(error){ toast('Milestone: '+error.message); return; }
  await loadData(); render();
}
async function deleteMilestone(id){
  if(!confirm('Delete this milestone?')) return;
  const {error}=await sb.from('job_milestones').delete().eq('id',id);
  if(error){ toast('Delete: '+error.message); return; }
  await loadData(); render();
}
async function moveMilestone(id,dir){
  const m=milestones.find(x=>x.id===id); if(!m) return;
  const arr=jobMilestones(m.job_id); const idx=arr.findIndex(x=>x.id===id);
  const swap=arr[idx+dir]; if(!swap) return;
  await sb.from('job_milestones').update({sequence:swap.sequence}).eq('id',m.id);
  await sb.from('job_milestones').update({sequence:m.sequence}).eq('id',swap.id);
  await loadData(); render();
}
function openMilestonesList(){
  const activeIds = new Set(jobs.filter(j=>j.status!=='Done').map(j=>j.id));
  return milestones
    .filter(m=>!m.done_at && activeIds.has(m.job_id))
    .map(m=>{ const j=jobs.find(x=>x.id===m.job_id); return {m, jobName:j?j.name:'', jobId:m.job_id}; })
    .sort((a,b)=>{ const ad=a.m.due_date, bd=b.m.due_date; if(!ad&&!bd) return 0; if(!ad) return 1; if(!bd) return -1; return ad.localeCompare(bd); });
}
function crewMini(id){ const c=crew.find(x=>x.id===id); if(!c) return ''; return `<span class="cr-who" title="Set by ${esc(c.name)}" style="background:${c.color||'#888'}">${esc(c.initials||(c.name||'?').slice(0,2))}</span>`; }
function renderMilestoneCrunch(){
  // this-week only: overdue + due within 7 days (future milestones stay off the board)
  const list = openMilestonesList().filter(x=>{ const d=x.m.due_date; if(!d) return false; const du=daysUntil(d); return du!==null && du<=7; });
  if(!list.length) return '';
  let overdue=0, week=0;
  list.forEach(x=>{ const du=daysUntil(x.m.due_date); if(du<0)overdue++; else week++; });
  const sum=[];
  if(overdue) sum.push(`<span style="color:var(--red);font-weight:700">${overdue} overdue</span>`);
  sum.push(`<span style="color:var(--amber)">${week} due this week</span>`);
  return `<div class="ms-crunch ${crunchOpen?'open':''}">
    <div class="ms-crunch-head" onclick="crunchOpen=!crunchOpen;render()">
      <span class="ct">📅 This week's milestones</span>
      <span class="csum">${sum.join(' · ')}</span>
      <span class="cchev">⌄</span>
    </div>
    <div class="ms-crunch-body">
      ${list.map(x=>{
        const du=daysUntil(x.m.due_date);
        const cls = du<0?'od':'soon';
        const dstr = fmtMsDate(x.m.due_date)+(du<0?` · ${-du}d late`:(du===0?' · today':''));
        return `<div class="ms-crunch-row" onclick="goJob('${x.jobId}')">
          <input type="checkbox" onclick="event.stopPropagation();toggleMilestone('${x.m.id}',true)" title="Mark done">
          <span class="cr-label">${esc(x.m.label)} <span class="cr-job">· ${esc(x.jobName)}</span></span>
          ${crewMini(x.m.set_by)}
          <span class="cr-date ${cls}">${dstr}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function msRow(j){
  const all = jobMilestones(j.id);
  if(!all.length) return '';
  const {done,total} = msProgress(j.id);
  const nx = nextMilestone(j.id);
  if(!nx){
    const last = all[all.length-1];
    return `<div class="ms-row"><input type="checkbox" class="ms-check" checked onclick="event.stopPropagation();toggleMilestone('${last.id}',false)" title="Un-check last milestone"><span class="ms-allclear">✓ All ${total} cleared</span><span class="ms-prog">${done}/${total}</span></div>`;
  }
  const dt = fmtMsDate(nx.due_date);
  return `<div class="ms-row">
    <input type="checkbox" class="ms-check" onclick="event.stopPropagation();toggleMilestone('${nx.id}',true)" title="Mark '${esc(nx.label)}' done">
    <span class="ms-label"><span class="ms-kicker">Next</span>${esc(nx.label)}</span>
    ${dt?`<span class="ms-date">${dt}</span>`:''}
    <span class="ms-prog">${done}/${total}</span>
  </div>`;
}

/* ============ DOCUMENTS ============ */
const DOC_LABELS = ['Drawing','Estimate','Spec','Photo','Other'];

async function uploadDocs(input, jobId){
  const files = [...input.files];
  if(!files.length) return;
  toast('Uploading…');
  for(const f of files){
    const ext = f.name.split('.').pop().toLowerCase();
    const fileType = ext==='pdf'?'pdf':'image';
    const path = `${jobId}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const {error:upErr} = await sb.storage.from('job-documents').upload(path, f);
    if(upErr){ toast('Upload failed: '+upErr.message); continue; }
    const label = fileType==='pdf'?'Drawing':'Photo';
    const {error:dbErr} = await sb.from('job_documents').insert({
      job_id: jobId, uploaded_by: currentUser?.id||null,
      file_name: f.name, file_path: path, file_type: fileType, label
    });
    if(dbErr){ toast('DB error: '+dbErr.message); }
  }
  await loadData(); render(); toast('Uploaded');
}

async function openDoc(path, fileType){
  if(docUrlCache[path]){ lightboxDoc(docUrlCache[path], fileType); return; }
  const {data} = await sb.storage.from('job-documents').createSignedUrl(path, 3600);
  if(data){ docUrlCache[path]=data.signedUrl; lightboxDoc(data.signedUrl, fileType); }
}
function lightboxDoc(url, fileType){
  if(fileType==='pdf'){ window.open(url,'_blank'); return; }
  lightbox(url);
}
async function hydrateDocs(jDocs){
  for(const d of jDocs){
    if(d.file_type==='image'){
      if(!docUrlCache[d.file_path]){
        const {data} = await sb.storage.from('job-documents').createSignedUrl(d.file_path, 3600);
        if(data) docUrlCache[d.file_path] = data.signedUrl;
      }
    }
  }
}
async function deleteDoc(docId, path){
  if(!confirm('Delete this document?')) return;
  await sb.storage.from('job-documents').remove([path]);
  await sb.from('job_documents').delete().eq('id', docId);
  delete docUrlCache[path];
  await loadData(); render();
}

  if(!msg){ toast('Enter a message'); return; }
  const {error} = await sb.from('job_flags').insert({
    job_id: jobId, flagged_by: currentUser?.id||null, message: msg
  });
  if(error){ toast('Failed: '+error.message); return; }
  document.getElementById('flagModal').remove();
  await loadData(); render(); toast('Flag sent to office');
}
async function resolveFlag(flagId){
  const {error} = await sb.from('job_flags').update({
    resolved: true, resolved_by: currentUser?.id||null, resolved_at: new Date().toISOString()
  }).eq('id', flagId);
  if(error){ toast('Failed: '+error.message); return; }
  await loadData(); render();
}

function crewAvatar(memberId, size=22){
  const m = crew.find(c=>c.id===memberId);
  if(!m) return '';
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:${m.color||'#f5a623'};color:#111;font-size:${Math.round(size*0.42)}px;font-weight:700;vertical-align:middle;margin-right:3px">${esc(m.initials||'?')}</span>`;
}

function logHtml(l){
  const issues = (l.issues||[]).map((iss,i)=>{
    const key = l.id+'|'+i;
    if(resolved.has(key)) return `<span class="tag">✓ ${esc(iss)}</span>`;
    return `<span class="tag issue">⚠ ${esc(iss)}<button onclick="resolveIssue('${key}')">resolve</button></span>`;
  }).join('');
  const crewTags = (l.crew||[]).map(c=>`<span class="tag">👤 ${esc(c)}</span>`).join('');
  const mats = (l.materials||[]).map(m=>`<span class="tag">▦ ${esc(m)}</span>`).join('');
  const photos = (l.photos||[]).map(p=>`<img data-path="${esc(p)}" alt="job photo" onclick="lightbox(this.src)">`).join('');
  const submitter = l.submitted_by ? crewAvatar(l.submitted_by, 20) : '';
  return `<div class="log">
    <div class="date" style="display:flex;align-items:center;gap:6px">${submitter}${fmtDate(l.date)}</div>
    <div class="work">${esc(l.work_performed)}</div>
    ${(crewTags||mats||issues)?`<div class="tags">${crewTags}${mats}${issues}</div>`:''}
    ${photos?`<div class="photos">${photos}</div>`:''}
  </div>`;
}

async function hydratePhotos(jLogs){
  const paths = jLogs.flatMap(l=>l.photos||[]);
  for(const p of paths){
    if(!photoUrlCache[p]){
      const {data} = await sb.storage.from(BUCKET).createSignedUrl(p,3600);
      if(data) photoUrlCache[p] = data.signedUrl;
    }
    document.querySelectorAll(`img[data-path="${CSS.escape(p)}"]`).forEach(img=>{ if(photoUrlCache[p]) img.src=photoUrlCache[p]; });
  }
}
function lightbox(src){
  if(!src) return;
  const lb=document.createElement('div'); lb.id='lightbox';
  lb.innerHTML=`
    <button onclick="event.stopPropagation();document.getElementById('lightbox').remove()" style="position:fixed;top:16px;right:20px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:28px;line-height:1;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:51">&#x2715;</button>
    <img src="${src}" style="cursor:default" onclick="event.stopPropagation()">`;
  lb.onclick=()=>lb.remove();
  document.body.appendChild(lb);
}

/* ============ MUTATIONS ============ */
async function updateJob(id, patch){
  const {error} = await sb.from('jobs').update(patch).eq('id',id);
  if(error){ toast('Save failed: '+error.message); return; }
  Object.assign(jobs.find(x=>x.id===id), patch);
  toast('Saved');
}
async function updateMoney(id, field, val){
  const j = jobs.find(x=>x.id===id);
  const patch = {[field]: Number(val)||0};
  const inv  = field==='amount_invoiced'?Number(val)||0:Number(j.amount_invoiced||0);
  const paid = field==='amount_paid'?Number(val)||0:Number(j.amount_paid||0);
  patch.still_owed = inv - paid;
  await updateJob(id, patch);
  if(view.name==='job') render();
}
async function resolveIssue(key){
  const {error} = await sb.from('resolved_issues').insert({key});
  if(error){ toast('Failed: '+error.message); return; }
  resolved.add(key); render();
}

function openLogModal(jobId){
  const opts = jobs.filter(j=>j.status!=='Done').sort(jobSort).map(j=>`<option value="${j.id}" ${j.id===jobId?'selected':''}>${esc(j.name)}</option>`).join('');
  const m = document.createElement('div'); m.className='modal-bg'; m.id='logModal';
  m.innerHTML=`<div class="modal" onclick="event.stopPropagation()">

    <label>Issues (comma separated)</label><input id="lgIssues" placeholder="Anything blocking?">
    <label>Photos</label><input type="file" id="lgPhotos" accept="image/*" multiple onchange="previewPhotos(this)">
    <div class="photo-previews" id="lgPreviews"></div>
    <div class="actions">
      <button class="btn secondary" onclick="document.getElementById('logModal').remove()">Cancel</button>
      <button class="btn" id="lgSave" onclick="saveLog()">Save log</button>
    </div>

function previewPhotos(input){
  $('#lgPreviews').innerHTML='';
  [...input.files].forEach(f=>{
    const img=document.createElement('img'); img.src=URL.createObjectURL(f);
    $('#lgPreviews').appendChild(img);
  });
}
async function saveLog(){
  const btn=$('#lgSave'); btn.disabled=true; btn.textContent='Saving…';
  const jobId=$('#lgJob').value;
  const files=[...$('#lgPhotos').files];
  const photoPaths=[];
  try{
    for(const f of files){
      const path=`${jobId}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,f);
      if(error) throw error;
      photoPaths.push(path);
    }
    const {error}=await sb.from('logs').insert({
      id: crypto.randomUUID(),
      job_id: jobId,
      date: $('#lgDate').value||today(),
      work_performed: $('#lgWork').value.trim(),
      crew: parseList($('#lgCrew').value),
      materials: parseList($('#lgMats').value),
      issues: parseList($('#lgIssues').value),
      photos: photoPaths,
      submitted_by: currentUser?.id || null
    });
    if(error) throw error;
    document.getElementById('logModal').remove();
    await loadData();
    view={name:'job',jobId}; render();
    toast('Log added');
  }catch(e){
    toast('Failed: '+e.message);
    btn.disabled=false; btn.textContent='Save log';
  }
}

async function saveJob(){

    id, name,
    client: $('#njClient').value.trim(),
    deadline: $('#njDeadline').value||null,
    priority: $('#njPrio').value,
    phase: $('#njPhase').value,

    amount_invoiced: 0,
    amount_paid: 0,
    still_owed: 0,
    start_date: today()

  await loadData(); render(); toast('Job created — Drive folder will appear shortly');
}

/* ============ ARCHIVE ============ */
function renderArchive(){
  const done = jobs.filter(j=>j.status==='Done').sort((a,b)=>{
    // Sort by most recently completed (use updated_at or start_date fallback)
    return (b.updated_at||b.start_date||'').localeCompare(a.updated_at||a.start_date||'');
  });

  // Totals
  const totalRevenue = done.reduce((s,j)=>s+Number(j.contract_value||0),0);
  const totalPaid    = done.reduce((s,j)=>s+Number(j.amount_paid||0),0);
  const totalCosts   = done.reduce((s,j)=>{
    const mats = jobCosts.filter(c=>c.job_id===j.id && c.cost_type==='material').reduce((x,c)=>x+Number(c.amount||0),0);
    const labor= jobCosts.filter(c=>c.job_id===j.id && c.cost_type==='labor').reduce((x,c)=>x+Number(c.amount||0),0);
    return s + mats + labor;
  },0);
  const totalHours = checkinJobs.filter(cj=>done.find(j=>j.id===cj.job_id)).reduce((s,cj)=>s+Number(cj.hours||0),0);

  let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <button class="btn secondary" style="width:auto;padding:8px 16px" onclick="goDash()">← Dashboard</button>
    <h2 style="font-size:20px;font-weight:700">Completed Jobs</h2>
    ${done.length?`<button class="btn secondary" style="width:auto;padding:8px 16px;margin-left:auto" onclick="exportArchive()">⬇ Export spreadsheet</button>`:''}
  </div>`;

  // Summary stats
  html += `<div class="cmd-stats" style="margin-bottom:24px">
    <div class="cmd-stat"><div class="num">${done.length}</div><div class="lbl">Jobs done</div></div>
    <div class="cmd-stat money"><div class="num">${fmtMoney(totalRevenue)}</div><div class="lbl">Total contract value</div></div>
    <div class="cmd-stat money"><div class="num">${fmtMoney(totalPaid)}</div><div class="lbl">Total collected</div></div>
    <div class="cmd-stat money"><div class="num">${fmtMoney(totalCosts)}</div><div class="lbl">Total costs</div></div>
    <div class="cmd-stat"><div class="num">${totalHours}</div><div class="lbl">Hours logged</div></div>
  </div>`;

  if(!done.length){
    html += `<div style="color:var(--muted);font-size:15px;padding:40px 0;text-align:center">No completed jobs yet.</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:10px">`;
    for(const j of done){
      const mats  = jobCosts.filter(c=>c.job_id===j.id && c.cost_type==='material').reduce((s,c)=>s+Number(c.amount||0),0);
      const labor = jobCosts.filter(c=>c.job_id===j.id && c.cost_type==='labor').reduce((s,c)=>s+Number(c.amount||0),0);
      const costs = mats + labor;
      const hrs   = checkinJobs.filter(cj=>cj.job_id===j.id).reduce((s,cj)=>s+Number(cj.hours||0),0);
      const margin= Number(j.contract_value||0) - costs;
      const nLogs = logs.filter(l=>l.job_id===j.id).length;

      html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;font-weight:700;margin-bottom:2px">${esc(j.name)}</div>
            <div style="font-size:13px;color:var(--muted);margin-bottom:10px">${esc(j.client||'— no client')}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px">
              ${j.contract_value?`<span style="background:rgba(34,197,94,.12);color:var(--green);border-radius:6px;padding:3px 8px">Contract ${fmtMoney(Number(j.contract_value))}</span>`:''}
              ${costs?`<span style="background:var(--card2);border-radius:6px;padding:3px 8px;color:var(--muted)">Costs ${fmtMoney(costs)}</span>`:''}
              ${j.contract_value&&costs?`<span style="background:${margin>=0?'rgba(34,197,94,.12)':'rgba(239,68,68,.12)'};color:${margin>=0?'var(--green)':'var(--red)'};border-radius:6px;padding:3px 8px">Margin ${fmtMoney(margin)}</span>`:''}
              ${hrs?`<span style="background:var(--card2);border-radius:6px;padding:3px 8px;color:var(--muted)">${hrs} hrs logged</span>`:''}
              ${nLogs?`<span style="background:var(--card2);border-radius:6px;padding:3px 8px;color:var(--muted)">${nLogs} logs</span>`:''}
              ${j.deadline?`<span style="background:var(--card2);border-radius:6px;padding:3px 8px;color:var(--muted)">Deadline ${j.deadline}</span>`:''}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;align-items:center">
            <button class="btn secondary" style="width:auto;padding:6px 12px;font-size:13px" onclick="goJob('${j.id}')">View</button>
            <button class="btn secondary" style="width:auto;padding:6px 12px;font-size:13px;color:var(--amber);border-color:var(--amber)" onclick="reopenJob('${j.id}')">↩ Reopen</button>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  $('#main').innerHTML = html;
}

async function reopenJob(id){
  await updateJob(id, {status:'Active'});
  await loadData();
  render();
  toast('Job reopened ✓');
}

function exportArchive(){
  const done = jobs.filter(j=>j.status==='Done');
  const rows = [['Job Name','Client','Phase','Contract Value','Amount Invoiced','Amount Paid','Still Owed','Total Costs','Margin','Hours Logged','Deadline','Logs']];
  for(const j of done){
    const mats  = jobCosts.filter(c=>c.job_id===j.id && c.cost_type==='material').reduce((s,c)=>s+Number(c.amount||0),0);
    const labor = jobCosts.filter(c=>c.job_id===j.id && c.cost_type==='labor').reduce((s,c)=>s+Number(c.amount||0),0);
    const costs = mats+labor;
    const hrs   = checkinJobs.filter(cj=>cj.job_id===j.id).reduce((s,cj)=>s+Number(cj.hours||0),0);
    const cv    = Number(j.contract_value||0);
    rows.push([
      j.name, j.client||'', j.phase||'',
      cv, Number(j.amount_invoiced||0), Number(j.amount_paid||0), Number(j.still_owed||0),
      costs, cv-costs, hrs, j.deadline||'',
      logs.filter(l=>l.job_id===j.id).length
    ]);
  }
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`FieldFlow-Archive-${today()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ============ END-OF-DAY CHECK-IN ============ */
function openCheckin(){
  ci = { step:1, selectedJobs:[], entries:{}, plan:'', flagJobId:'', flagMsg:'' };
  renderCheckin();
}

function renderCheckin(){
  const existing = document.getElementById('checkinModal');
  if(existing) existing.remove();

  const activeJobs = jobs.filter(j=>j.status!=='Done').sort(jobSort);
  const STEPS = 4;
  const pips = Array.from({length:STEPS},(_,i)=>`<div class="ci-pip ${i+1<ci.step?'done':i+1===ci.step?'active':''}"></div>`).join('');

  let content = '';

  if(ci.step===1){
    content = `<h3 style="margin-bottom:4px">End of Day ☑</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Which jobs did you work on today?</p>
      ${activeJobs.length===0?'<p style="color:var(--muted);font-size:14px">No active jobs.</p>':''}
      ${activeJobs.map(j=>`
        <div class="job-check ${ci.selectedJobs.includes(j.id)?'selected':''}" onclick="ciToggleJob('${j.id}')">
          <input type="checkbox" ${ci.selectedJobs.includes(j.id)?'checked':''} onclick="event.stopPropagation();ciToggleJob('${j.id}')">
          <div class="jc-info">
            <div class="jc-name">${esc(j.name)}</div>
            <div class="jc-client">${esc(j.client||'— no client')}</div>
          </div>
        </div>`).join('')}
      <div class="actions" style="margin-top:16px">
        <button class="btn secondary" onclick="document.getElementById('checkinModal').remove()">Cancel</button>
        <button class="btn" onclick="ciNext()" ${ci.selectedJobs.length===0?'disabled':''}>Next →</button>
      </div>`;
  }

  if(ci.step===2){
    content = `<h3 style="margin-bottom:4px">Hours worked</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px">How many hours on each job today?</p>
      ${ci.selectedJobs.map(jid=>{
        const j=jobs.find(x=>x.id===jid)||{};
        const e=ci.entries[jid]||{};
        return `<div class="hours-entry">
          <div class="he-name">${esc(j.name||jid)}</div>
          <div class="hours-row">
            <input type="number" min="0" max="24" step="0.5" placeholder="hrs"
              value="${e.hours||''}"
              oninput="if(!ci.entries['${jid}'])ci.entries['${jid}']={};ci.entries['${jid}'].hours=this.value"
              style="width:90px;flex-shrink:0">
            <input type="text" placeholder="Quick note (optional)"
              value="${e.notes||''}"
              oninput="if(!ci.entries['${jid}'])ci.entries['${jid}']={};ci.entries['${jid}'].notes=this.value">
          </div>
        </div>`;
      }).join('')}
      <div class="actions" style="margin-top:16px">
        <button class="btn secondary" onclick="ciBack()">← Back</button>
        <button class="btn" onclick="ciNext()">Next →</button>
      </div>`;
  }

  if(ci.step===3){
    content = `<h3 style="margin-bottom:4px">Wrap up</h3>
      <label style="margin-top:0">What's the plan for tomorrow?</label>
      <textarea id="ciPlan" rows="3" placeholder="e.g. Finish welding on Herb Covers, start install at Westminster">${ci.plan}</textarea>
      <label style="margin-top:14px">Flag something for the office? <span style="font-weight:400;font-size:11px;text-transform:none">(optional)</span></label>
      <select id="ciFlagJob" style="margin-bottom:8px">
        <option value="">— pick a job —</option>
        ${ci.selectedJobs.map(jid=>{const j=jobs.find(x=>x.id===jid)||{};return `<option value="${jid}" ${ci.flagJobId===jid?'selected':''}>${esc(j.name||jid)}</option>`;}).join('')}
      </select>
      <textarea id="ciFlagMsg" rows="2" placeholder="What do you need the office to know?">${ci.flagMsg}</textarea>
      <div class="actions" style="margin-top:16px">
        <button class="btn secondary" onclick="ciSavePlanFlag();ciBack()">← Back</button>
        <button class="btn" onclick="ciSavePlanFlag();ciNext()">Next →</button>
      </div>`;
  }

  if(ci.step===4){
    const summaryRows = ci.selectedJobs.map(jid=>{
      const j=jobs.find(x=>x.id===jid)||{};
      const e=ci.entries[jid]||{};
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px">
        <div>
          <div>${esc(j.name||jid)}</div>
          ${e.notes?`<div style="color:var(--muted);font-size:12px">${esc(e.notes)}</div>`:''}
        </div>
        <span style="color:var(--accent);font-weight:700;white-space:nowrap;margin-left:12px">${Number(e.hours||0)} hrs</span>
      </div>`;
    }).join('');
    const totalHrs = ci.selectedJobs.reduce((s,jid)=>s+Number(ci.entries[jid]?.hours||0),0);
    content = `<h3 style="margin-bottom:4px">All set?</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Review and submit your check-in.</p>
      <div style="background:var(--card2);border-radius:8px;padding:12px 14px;margin-bottom:14px">
        ${summaryRows}
        <div style="padding-top:10px;font-size:12px;color:var(--muted)">Total today: <strong style="color:var(--text);font-size:14px">${totalHrs} hrs</strong></div>
      </div>
      ${ci.plan?`<div style="font-size:13px;margin-bottom:10px"><span style="color:var(--muted)">Tomorrow: </span>${esc(ci.plan)}</div>`:''}
      ${ci.flagJobId&&ci.flagMsg?`<div style="font-size:12px;color:var(--amber);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:8px 12px;margin-bottom:10px">⚑ Flag: ${esc(ci.flagMsg)}</div>`:''}
      <div class="actions">
        <button class="btn secondary" onclick="ciBack()">← Back</button>
        <button class="btn" id="ciSubmit" onclick="submitCheckin()">Submit ✓</button>
      </div>`;
  }

  const m = document.createElement('div');
  m.className='modal-bg'; m.id='checkinModal';
  m.innerHTML=`<div class="modal" onclick="event.stopPropagation()" style="max-width:520px;max-height:90vh;overflow-y:auto">
    <div class="ci-progress">${pips}</div>
    ${content}
  </div>`;
  m.onclick=()=>m.remove();
  document.body.appendChild(m);
}

function ciSavePlanFlag(){
  ci.plan = (document.getElementById('ciPlan')?.value)||ci.plan;
  ci.flagJobId = (document.getElementById('ciFlagJob')?.value)||ci.flagJobId;
  ci.flagMsg = (document.getElementById('ciFlagMsg')?.value)||ci.flagMsg;
}
function ciToggleJob(jid){
  const idx=ci.selectedJobs.indexOf(jid);
  if(idx===-1) ci.selectedJobs.push(jid);
  else ci.selectedJobs.splice(idx,1);
  renderCheckin();
}
function ciNext(){ ci.step++; renderCheckin(); }
function ciBack(){ ci.step--; renderCheckin(); }

async function submitCheckin(){
  const btn=document.getElementById('ciSubmit');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }

  // Upsert daily_checkins row
  const {data:ciRow, error:ciErr} = await sb.from('daily_checkins').upsert({
    crew_member_id: currentUser.id,
    date: today(),
    plan_tomorrow: ci.plan.trim()||null
  },{onConflict:'crew_member_id,date'}).select('id').single();

  if(ciErr){ toast('Failed: '+ciErr.message); if(btn){btn.disabled=false;btn.textContent='Submit ✓';} return; }
  const realCiId = ciRow.id;

  // Replace job entries for today
  await sb.from('checkin_jobs').delete().eq('checkin_id', realCiId);
  const jobEntries = ci.selectedJobs
    .filter(jid=>Number(ci.entries[jid]?.hours||0)>0)
    .map(jid=>({
      checkin_id: realCiId,
      job_id: jid,
      hours: Number(ci.entries[jid].hours),
      notes: ci.entries[jid].notes||null
    }));
  if(jobEntries.length){
    const {error:jeErr}=await sb.from('checkin_jobs').insert(jobEntries);
    if(jeErr) toast('Warning: hours save failed — '+jeErr.message);
  }

  // Log T&M cost entries for any jobs with a tm_rate set
  for(const jid of ci.selectedJobs){
    const j=jobs.find(x=>x.id===jid);
    const hrs=Number(ci.entries[jid]?.hours||0);
    if(j && Number(j.tm_rate||0)>0 && hrs>0){
      await sb.from('job_costs').insert({
        job_id: jid,
        submitted_by: currentUser.id,
        cost_type: 'labor',
        description: `Labor — ${currentUser.name||'Crew'} (check-in ${today()})`,
        hours: hrs,
        amount: hrs * Number(j.tm_rate),
        date: today()
      });
    }
  }

  // Save flag if filled out
  if(ci.flagJobId && ci.flagMsg.trim()){
    await sb.from('job_flags').insert({
      job_id: ci.flagJobId,
      flagged_by: currentUser.id,
      message: ci.flagMsg.trim()
    });
  }

  document.getElementById('checkinModal')?.remove();
  await loadData(); render();
  toast(`Check-in submitted ✓ — ${ci.selectedJobs.length} job${ci.selectedJobs.length===1?'':'s'}, good work!`);
}

/* ============ FAB ============ */
$('#fab').onclick = () => openLogModal(view.jobId || (jobs.filter(j=>j.status!=='Done').sort(jobSort)[0]||{}).id);

init();
</script>
